<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Violeta Ocaña — 2D & 3D Artist, Animation, Visual Development</title>
<meta name="description" content="Portfolio of Violeta Ocaña, 2D & 3D artist working across animation, visual development, concept art and storyboarding.">
<meta property="og:title" content="Violeta Ocaña">
<meta property="og:description" content="2D & 3D artist: animation and visual development.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Reenie+Beanie&family=Rubik:wght@800&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..400&display=swap" rel="stylesheet">
<style>
/* ===== TOKENS ===== */
:root{--ink:#050505;--bone:#f1ede6;--grey:#8a8681;--red:#ff303f;--pad:clamp(1rem,2vw,1.75rem);
--f:"Archivo","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink);scroll-behavior:smooth}
body{background:var(--ink);color:var(--bone);font:400 .75rem/1.4 var(--f);font-stretch:100%;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.d{font:300 1em/1.05 "Newsreader",Georgia,serif;letter-spacing:-.02em}
.glow{color:var(--bone)}
.mut{color:var(--grey)}

/* ===== NAV (siempre visible) ===== */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;padding:var(--pad);mix-blend-mode:difference;color:#fff}
.nav a{width:max-content;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;transition:text-decoration-color .3s}
.nav a:hover,.nav a[aria-current]{text-decoration-color:currentColor}

/* ===== INTRO: logo, texto, botón (composición de la captura) ===== */
.intro{position:fixed;inset:0;z-index:60;background:var(--ink);display:grid;place-items:center;padding:var(--pad);clip-path:inset(0);transition:clip-path .8s cubic-bezier(.7,0,.2,1)}
.intro.gone{clip-path:inset(0 0 100% 0)}
.stack{display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateY(3svh)}
.logo{--lg:clamp(32px,3.6vw,68px);width:var(--lg);height:var(--lg);border-radius:50%;object-fit:cover;opacity:0}
.ph{margin:clamp(1.4rem,2.2vw,2.4rem) 0 clamp(1.2rem,1.8vw,2rem);min-height:2.5em;display:flex;justify-content:center;align-items:center;gap:.28em;white-space:nowrap;font:300 clamp(.8rem,.95vw,1rem)/1.2 "Newsreader",Georgia,serif;letter-spacing:.005em;color:var(--bone)}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;overflow:hidden;padding:.1em .03em .16em;margin:-.1em -.03em -.16em;vertical-align:top}
.ch b{display:inline-block;font-weight:inherit}
.enter{position:relative;visibility:hidden;background:transparent;color:var(--bone);padding:.75em 2em .65em;font:800 clamp(.72rem,.82vw,.85rem)/1 "Rubik","Arial Rounded MT Bold",Arial,sans-serif;text-transform:lowercase;letter-spacing:-.02em;transition:color .25s}
.enter:focus-visible{outline:0}
.scrib{position:absolute;left:-5%;top:-12%;width:110%;height:124%;overflow:visible;pointer-events:none;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:1}
.scrib path{vector-effect:non-scaling-stroke}
.enter i{display:inline-block;font-style:normal;transition:transform .4s cubic-bezier(.22,1,.36,1)}
.enter:hover,.enter:focus-visible{color:var(--red)}
.enter:hover i,.enter:focus-visible i{transform:translate(.15em,-.15em)}
.skip{position:absolute;right:var(--pad);bottom:var(--pad);color:var(--grey);border-bottom:1px solid currentColor}
.skip:hover{color:var(--bone)}

/* ===== PLACEHOLDER ART (sustituir por <img>/<video>) ===== */
.art{position:absolute;inset:0;background:#070707;overflow:hidden}
.art::before{content:"";position:absolute;width:44%;aspect-ratio:1;left:calc(var(--x) - 22%);top:calc(var(--y) - 22%);border-radius:50%;background:var(--a)}
.art i{position:absolute;left:calc(var(--x) - 9%);top:calc(var(--y) - 12%);width:18%;height:70%;border-radius:50% 50% 8% 8%;background:#050505;transform:rotate(var(--r))}
.art img,.art video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.playing .art::before{animation:drift 5s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(9%,-7%) scale(1.18)}}

/* ===== GALERÍA ===== */
main{transition:opacity .25s}
main.out{opacity:0}
.works{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--pad);padding:7rem var(--pad) 6rem;align-items:start}
.item{display:block;grid-column:var(--c);margin-top:var(--mt)}
.frame{position:relative;aspect-ratio:var(--r);overflow:hidden;background:#0b0b0b}
.item .art{filter:grayscale(1) contrast(1.15);transition:filter .5s,transform .8s cubic-bezier(.2,.7,.2,1)}
.item:hover .art,.item:focus-visible .art{filter:none;transform:scale(1.03)}
.cap{display:flex;justify-content:space-between;gap:1rem;margin-top:.7rem}
.cap b{font-weight:500}
.cap span{color:var(--grey);text-align:right}
.lead{grid-column:1/-1;margin-bottom:5vw;font-size:clamp(.8rem,1.1vw,.95rem);max-width:34ch;color:var(--grey)}

/* ===== HOME: cinta vertical infinita + preview central ===== */
.home{--ts:clamp(52px,3.8vw,76px);--tg:calc(var(--ts)*1.3);position:relative;height:100svh;overflow:hidden}
.belt{position:absolute;left:var(--pad);top:3.2rem;bottom:0;width:var(--ts);overflow:hidden}
.track{display:flex;flex-direction:column;animation:belt calc(var(--n)*4.5s) linear infinite;will-change:transform}
.set{display:flex;flex-direction:column;gap:var(--tg);padding-bottom:var(--tg)}
@keyframes belt{to{transform:translate3d(0,-50%,0)}}
.th{display:block;width:var(--ts);transition:opacity .3s}
.th .frame{display:block;width:100%}
.th .art{filter:grayscale(1);transition:filter .4s}.th:hover .art,.th.on .art{filter:none}
.th .art img{object-position:72% 50%}
.home.hov .th{opacity:.3}.home.hov .th.on{opacity:1}
/* preview 16:9 centrada (inicio y Selected Works) */
.stage{position:fixed;left:50%;top:50%;width:min(66vw,calc((100svh - 9rem)*1.7778));aspect-ratio:16/9;transform:translate(-50%,-50%);pointer-events:none;z-index:5}
.pv{position:absolute;inset:0}
.pv .frame{position:absolute;inset:0;background:#000;opacity:0;transform:scale(.88);transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .35s}
.stage.open .pv.on .frame{opacity:1;transform:none}
.pv video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.pv .art img{object-fit:contain;background:#000}
.gp .art{background:var(--red)}.gp .art::before,.gp .art i{display:none}
.works.g{row-gap:5rem;column-gap:3vw}
.works h1{grid-column:1/-1;font-size:clamp(2rem,4vw,3.25rem);margin-bottom:3rem}

/* ===== PROYECTO ===== */
.hero{min-height:100svh;padding:4.5rem var(--pad) 3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;position:relative}
.reel{position:relative;width:min(82vw,calc((100svh - 12rem)*1.7778));aspect-ratio:16/9;display:block;overflow:hidden}
.tc{position:absolute;left:.8rem;bottom:.8rem;z-index:3;font-variant-numeric:tabular-nums;mix-blend-mode:difference;color:#fff}
.pbtn{display:none;position:absolute;z-index:3;right:.8rem;bottom:.8rem;background:var(--red);color:#000;padding:.4rem 1rem;border-radius:99px;font-weight:500}
.info{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--pad);padding:6rem var(--pad)}
.info h1{grid-column:1/-1;font-size:clamp(2rem,4.2vw,3.5rem);margin-bottom:3rem}
.meta{grid-column:1/5;display:grid;gap:.9rem}
.meta div{display:grid;grid-template-columns:5rem 1fr}
.desc{grid-column:7/13;font:300 clamp(1.05rem,1.4vw,1.3rem)/1.4 "Newsreader",Georgia,serif;max-width:40ch}
.proc{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--pad);row-gap:6vw;padding:2rem var(--pad) 6rem}
.proc h2{grid-column:1/-1;font-weight:500}
.step{grid-column:var(--c);margin-top:var(--mt,0)}
.credits{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--pad);padding:2rem var(--pad) 6rem;border-top:1px solid #222}
.credits h2{grid-column:1/5;font-weight:500}
.credits dl{grid-column:7/13;display:grid;grid-template-columns:9rem 1fr;gap:.5rem}
.credits dt{color:var(--grey)}
.sel{padding:2rem var(--pad) 5rem}
.sel h2{font-weight:500;margin-bottom:1.5rem}
.sel .row{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--pad)}

/* ===== ABOUT / CONTACT ===== */
.page{padding:8rem var(--pad) 6rem;min-height:100svh}
.page h1{font-size:clamp(2rem,4vw,3.25rem);margin-bottom:5rem}
.cols{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--pad);row-gap:3rem}
.cols>*{grid-column:span 4}.cols>.bio{grid-column:1/6;font:300 clamp(1.05rem,1.4vw,1.3rem)/1.4 "Newsreader",Georgia,serif}
.cols h2{font-weight:500;margin-bottom:.8rem;color:var(--grey)}
.cols li{list-style:none;padding:.15rem 0}
.mail{font:300 clamp(1.6rem,4.2vw,3.4rem)/1.1 "Newsreader",Georgia,serif;letter-spacing:-.02em;word-break:break-all;transition:color .25s}
.mail:hover{color:var(--red)}
.soc{margin-top:4rem;display:flex;gap:2.5rem;flex-wrap:wrap}
.soc a{border-bottom:1px solid currentColor}.soc a:hover{color:var(--red)}
.mk{display:block;overflow:hidden;padding-bottom:.12em;margin-bottom:-.12em}.mk>span{display:block}
.acts{margin-top:2.5rem;display:flex;gap:2.5rem;flex-wrap:wrap;overflow:hidden;padding:.2rem 0}.acts a,.acts button{border-bottom:1px solid currentColor;padding-bottom:1px;letter-spacing:.08em;transition:color .25s}.acts a:hover,.acts button:hover{color:var(--red)}

/* ===== Nav extra, índice, final film, volver, transición ===== */
.nav .links{display:flex;gap:1.6rem}
.nav sup{font-size:.6em;color:var(--grey);margin-left:.15em}
.pos{justify-self:end;font-variant-numeric:tabular-nums;color:var(--grey)}
.cap b{transition:font-stretch .35s}
.item:hover .cap b,.item:focus-visible .cap b{font-stretch:120%}
.works.g .cap{flex-direction:column;gap:.15rem;border-top:1px solid #222;padding-top:.5rem}
.works.g .cap span{text-align:left}
.works.g .art{background:var(--red);filter:none}
.works.g .art::before,.works.g .art i{display:none}
.works.g .art img{filter:grayscale(1);object-position:72% 50%;transition:filter .5s}
.works.g .item:hover .art img,.works.g .item:focus-visible .art img{filter:none}
.final{padding:0 var(--pad) 6rem}.final h2{font-weight:500;margin-bottom:1rem}.final .reel{width:100%}
.sel .row{display:grid;grid-template-columns:repeat(3,minmax(0,14vw));gap:3vw}
.back{padding:0 var(--pad) 4rem}.back a{border-bottom:1px solid currentColor;letter-spacing:.08em;transition:color .25s}.back a:hover{color:var(--red)}
#veil{position:fixed;inset:0;z-index:70;background:var(--ink);display:grid;place-items:center;pointer-events:none;clip-path:inset(0 0 100% 0)}
#veil span{font:italic 300 .95rem/1 "Newsreader",Georgia,serif;color:var(--bone)}

/* ===== Botón de firma bajo el vídeo + galería de vídeos ===== */
.more{display:flex;flex-direction:column;align-items:center;gap:.1rem;font:400 clamp(1.05rem,1.3vw,1.3rem)/1 "Reenie Beanie","Segoe Script",cursive;text-transform:uppercase;letter-spacing:.08em;color:var(--bone);transition:color .25s}
.more i{font-style:normal;font-size:.9em;animation:nudge 1.8s ease-in-out infinite}
.more:hover,.more:focus-visible{color:var(--red)}
@keyframes nudge{50%{transform:translateY(4px)}}
.vg{display:grid;grid-template-columns:23% 1fr;column-gap:4vw;padding:2rem var(--pad) 8rem;align-items:start}
.vg h2{grid-column:1/-1;font-weight:500;margin-bottom:3rem}
.vcol{display:flex;flex-direction:column;gap:5rem}
.vfree{display:grid;grid-template-columns:repeat(8,1fr);gap:6rem 2vw;align-items:start}
.vi{position:relative;animation:bob 8s ease-in-out var(--d,0s) infinite alternate}
.vi:hover{z-index:5;animation-play-state:paused}
.vf{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0b0b0b;transition:transform .7s cubic-bezier(.22,1,.36,1)}
.vi:hover .vf{transform:scale(1.14)}
.vi figcaption{margin-top:.55rem;font-size:.625rem;color:var(--grey)}
@keyframes bob{from{transform:translateY(-8px)}to{transform:translateY(8px)}}

/* ===== CURSOR: ojo rojo ===== */
#cur{display:none;position:fixed;inset:0;z-index:100;pointer-events:none;opacity:0;transition:opacity .25s}
.has-cur #cur{display:block}
#cur.vis{opacity:1}
.has-cur,.has-cur *{cursor:none!important}
#cur .eye,#cur span{position:fixed;left:0;top:0;will-change:transform}
#cur .eye{width:22px;height:15px;margin:-7.5px 0 0 -11px}
#cur .eye svg{display:block;width:100%;height:100%;overflow:visible}
#cur .eye path{fill:none;stroke:#FF303F;stroke-width:1.6;stroke-linejoin:round}
#cur .eye circle{fill:#FF303F}
#cur .eye .lash{stroke-width:1.1;stroke-linecap:round}
#cur span{margin:12px 0 0 14px;font:500 .625rem/1 var(--f);letter-spacing:.08em;text-transform:uppercase;color:#fff;white-space:nowrap;opacity:0;transition:opacity .2s}
#cur.lab span{opacity:1}
@media(hover:none){.pbtn{display:block}}

@media(max-width:800px){
  .nav{gap:.8rem}.nav .links{gap:1rem}.nav sup{display:none}
  .works,.info,.proc,.credits,.cols{display:block}.works.g{display:grid;grid-template-columns:repeat(2,1fr);column-gap:1rem;row-gap:0}.works.g .item{grid-column:auto}
  .item,.step{margin:0 0 2.5rem!important}
  .info h1{margin-bottom:2rem}.meta{margin-bottom:2rem}
  .credits dl{margin-top:1rem}
  .sel .row{grid-template-columns:1fr}
  .page h1{margin-bottom:3rem}.cols>*{margin-bottom:2rem}
}
@media(max-width:1100px){.sel .row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.stage{width:min(92vw,calc((100svh - 9rem)*1.7778))}}
@media(max-width:800px){.works.g .item{grid-column:auto}}
@media(max-width:800px){.vg{display:block}.vcol{gap:2.5rem;margin-bottom:2.5rem}.vfree{display:block}.vfree .vi{margin:0 0 2.5rem!important}}
@media(prefers-reduced-motion:reduce){.belt{overflow-y:auto;scrollbar-width:none}.set[aria-hidden]{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before{transition-duration:.01ms!important;animation:none!important}}
.reel iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:3}.reel.embedded .tc,.reel.embedded .pbtn{display:none}
.bn{position:fixed;left:0;top:0;z-index:2;pointer-events:none;white-space:nowrap;font:300 clamp(.8rem,.95vw,1rem)/1.2 "Newsreader",Georgia,serif;color:var(--bone);will-change:transform}
.home.hov .track{animation-play-state:paused}
.pv iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;opacity:0;transition:opacity .4s}.pv iframe.ld{opacity:1}
</style>
</head>

/* ===== PREVIEW CENTRAL: hover (ratón) o toque (móvil) → vídeo 16:9 ampliado ===== */
function bindPreview(trigs,list,tot=list.length,keep){
  const st=$('.stage'),pv=[...st.querySelectorAll('.pv')],root=st.closest('.home'),touch=matchMedia('(hover:none)').matches;
  const ix=t=>t.dataset.i!==undefined?+t.dataset.i:trigs.indexOf(t);
  let cur=-1,ht;
  const vids=(v,on)=>{const vid=v.querySelector('video'),f=v.querySelector('iframe');if(vid){on?vid.play().catch(()=>{}):vid.pause();}
    if(v.dataset.pv){clearTimeout(v._t);if(!on)f&&f.remove();else if(!f)v._t=setTimeout(()=>v.querySelector('.frame').append(mkFrame(v.dataset.pv,1)),200);}   /* iframe solo tras 200 ms de pausa del ratón */
    v.classList.toggle('playing',on);};
  const show=i=>{clearTimeout(ht);cur=i;
    pv.forEach((v,k)=>{v.classList.toggle('on',k===i);vids(v,k===i);});
    trigs.forEach(t=>t.classList.toggle('on',ix(t)===i));
    st.classList.add('open');root&&root.classList.add('hov');st.style.pointerEvents=touch?'auto':'none';setPos(i+1,tot);};
  const hide=()=>{clearTimeout(ht);ht=setTimeout(()=>{if(keep){root&&root.classList.remove('hov');return;}cur=-1;st.classList.remove('open');root&&root.classList.remove('hov');
    trigs.forEach(t=>t.classList.remove('on'));pv.forEach(v=>{v.classList.remove('on');vids(v,false);});st.style.pointerEvents='none';setPos(0,tot);},touch?0:450);};
  trigs.forEach(t=>{const i=ix(t);
    t.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')show(i);});
    t.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')hide();});
    t.addEventListener('focus',()=>show(i));t.addEventListener('blur',hide);
    t.addEventListener('click',e=>{if(touch&&cur!==i){e.preventDefault();show(i);}});   /* móvil: 1er toque = preview, 2º = entrar */
  });
  st.addEventListener('click',()=>{if(cur>=0)nav(list[cur].href||'#/work/'+list[cur].id);});
  main.onclick=e=>{if(touch&&!e.target.closest('.stage,a'))hide();};
  if(keep){show(0);root&&root.classList.remove('hov');}   /* inicio: siempre hay un proyecto grande; por defecto el primero */
}
function bindHome(){setPos(0,TILES.length);bindPreview([...document.querySelectorAll('.th')],TILES,TILES.length,1);}

/* ===== VÍDEOS: siempre al menos uno en reproducción (máx. 3 a la vez) ===== */
function bindVideos(){
  const vfs=[...document.querySelectorAll('.vf')];if(!vfs.length)return;
  const vis=new Set();
  const on=(f,play)=>{const v=f.querySelector('video');if(v){play?v.play().catch(()=>{}):v.pause();}f.classList.toggle('playing',play);};
  const refresh=()=>{if(reduce)return;const live=vfs.filter(f=>vis.has(f)).slice(0,3);vfs.forEach(f=>on(f,live.includes(f)||f.matches(':hover')));};
  const io=new IntersectionObserver(es=>{es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target));refresh();},{threshold:.35});
  vfs.forEach(f=>{io.observe(f);f.addEventListener('pointerenter',()=>on(f,true));f.addEventListener('pointerleave',refresh);});
}

/* ===== REEL: play / pause / close (hero y vídeo final) ===== */
function bindReel(){
  document.querySelectorAll('.reel').forEach(reel=>{
    const tc=reel.querySelector('.tc'),vid=reel.querySelector('video'),btn=reel.querySelector('.pbtn');let t=0,tick;
    const toggle=()=>{if(reel.dataset.embed){if(!reel.querySelector('iframe')){reel.append(mkFrame(reel.dataset.embed));reel.classList.add('embedded');reel.removeAttribute('data-cursor');cur.classList.remove('vis');reel.onpointerleave=()=>cur.classList.add('vis');}return;}const on=reel.classList.toggle('playing');btn.textContent=on?'pause':'play';lab.textContent=lbl(on?'pause':'play');
      if(vid)on?vid.play():vid.pause();clearInterval(tick);
      if(on)tick=setInterval(()=>{if(!reel.isConnected){clearInterval(tick);return;}t=(t+1)%30;tc.textContent=`00:${String(t).padStart(2,'0')} / 00:30`;},1000);};
    reel.addEventListener('click',e=>{e.stopPropagation();toggle();});
    reel.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();}});
  });
  $('#hero').addEventListener('click',()=>{nav('#/');});
  $('#more').addEventListener('click',e=>{e.stopPropagation();$('#info').scrollIntoView({behavior:reduce?'auto':'smooth'});});
}

/* ===== CURSOR: ojo rojo (solo ratón). Mantiene las etiquetas View / Play / Close ===== */
const cur=$('#cur'),lab=cur.querySelector('span'),eye=cur.querySelector('.eye'),eyeSvg=eye.firstElementChild;
const lbl=k=>({view:'View ↗',play:'Play',pause:'Pause',close:'Close',more:'Scroll ↓'}[k]||k);
if(matchMedia('(hover:hover) and (pointer:fine)').matches){
  document.documentElement.classList.add('has-cur');
  const m={x:0,y:0},p={x:0,y:0};let raf=0,seen=false;
  const put=()=>{const t=`translate(${p.x}px,${p.y}px)`;eye.style.transform=t;lab.style.transform=t;};
  const frame=()=>{p.x+=(m.x-p.x)*.45;p.y+=(m.y-p.y)*.45;put();raf=Math.abs(m.x-p.x)+Math.abs(m.y-p.y)>.3?requestAnimationFrame(frame):0;};
  addEventListener('pointermove',e=>{
    m.x=e.clientX;m.y=e.clientY;
    if(!seen){seen=true;p.x=m.x;p.y=m.y;put();cur.classList.add('vis');}
    if(reduce){p.x=m.x;p.y=m.y;put();}else if(!raf)raf=requestAnimationFrame(frame);
  });
  addEventListener('pointerdown',()=>{if(!reduce)eyeSvg.animate([{transform:'scaleY(1)',easing:'cubic-bezier(.5,0,.9,.4)'},{transform:'scaleY(.06)',offset:.36,easing:'cubic-bezier(.1,.6,.3,1)'},{transform:'scaleY(1)'}],{duration:240});});   /* pestañeo */
  document.addEventListener('pointerover',e=>{
    const t=e.target.closest('[data-cursor]');cur.classList.toggle('lab',!!t);
    if(t){const k=t.dataset.cursor;lab.textContent=lbl(k==='play'&&t.classList.contains('playing')?'pause':k);}
  });
  document.documentElement.addEventListener('pointerleave',()=>cur.classList.remove('vis'));
  document.documentElement.addEventListener('pointerenter',()=>seen&&cur.classList.add('vis'));
}

    const f=t=>{const dt=Math.min((t-t0)/1000,.05);t0=t;a=Math.min(1,a+dt/1.5);ps=Math.max(0,ps-dt);const e=a*a*(3-2*a)*(ps?0:1);x+=vx*e*dt;y+=vy*e*dt;const mx=innerWidth-bw,my=innerHeight-bh;
      const hX=x<0||x>mx,hY=y<0||y>my;if(x<0||x>mx){x=x<0?0:mx;vx=-vx;q=1;hx=1;}if(y<0||y>my){y=y<0?0:my;vy=-vy;q=1;hx=0;}
      if(hX&&(y<40||y>my-40)||hY&&(x<40||x>mx-40)){et=0;}et+=dt;const s=1-.12*Math.exp(-et*4)*Math.cos(et*14);q=Math.max(0,q-dt*3);const k=q*.22;b.style.transform=`translate(${x}px,${y}px) scale(${(hx?1-k:1+k)*s},${(hx?1+k:1-k)*s})`;raf=requestAnimationFrame(f);};
    raf=requestAnimationFrame(f);}   /* rebota en los bordes con un pequeño squash */
  function done(){if(entered)return;entered=true;cancelAnimationFrame(raf);intro.classList.add('gone');document.body.classList.remove('lock');main.focus({preventScroll:true});
    setTimeout(()=>intro.remove(),900);removeEventListener('keydown',key);}
  const key=e=>{if(e.key==='Enter'||e.key===' '||e.key==='Escape'){e.preventDefault();ready?done():skip();}};
  async function seq(){
    logo.animate([{opacity:0,transform:'scale(.85)'},{opacity:1,transform:'none'}],{duration:900,easing:EASE,fill:'both'});
    await sleep(350);
    for(const [t,hold] of SEQ){
      if(skipped)break;
      const bs=build(t);
      run(bs,'translateY(105%)','none',650,22,EASE);
      if(t.includes('move')){const lw=ph.querySelector('.w:last-child');
        setTimeout(()=>lw.isConnected&&!skipped&&bounce(lw),900);}
      await sleep(650+bs.length*22+hold);
      if(skipped)break;
      run(bs,'none','translateY(-105%)',420,12,'cubic-bezier(.64,0,.78,0)');
      await sleep(420+bs.length*12+80);
    }
    ph.innerHTML='';
    enter.style.visibility='visible';
    enter.querySelectorAll('path').forEach((p,i)=>p.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:reduce?1:900,delay:reduce?0:i*140,easing:EASE,fill:'both'}));
    enter.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:700,easing:EASE,fill:'both'});
    skipBtn.hidden=true;ready=true;
  }
  if(RT.replace('#','').replace('/','')){intro.remove();document.body.classList.remove('lock');}
  else{enter.addEventListener('click',done);skipBtn.addEventListener('click',skip);
    intro.addEventListener('click',e=>{if(!ready&&e.target!==skipBtn)skip();});addEventListener('keydown',key);seq();}
  render();
})();
</script>
</body>
</html>
